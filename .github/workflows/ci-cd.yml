name: CI/CD Microservice Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Build Docker Image
        run: docker build -t k8s-microservice-pipeline:v1 .

      - name: 3. Load Image into Minikube Cache
        run: minikube image load k8s-microservice-pipeline:v1

      - name: 4. Deploy Declarative Kubernetes Manifests
        run: kubectl apply -f k8s/

      - name: 5. Verify Zero-Downtime Rollout
        run: kubectl rollout status deployment/k8s-microservice-deployment --timeout=90s

      - name: 6. Automated Pipeline Health Check
        run: |
          echo "Starting temporary port-forward on port 8888..."
          kubectl port-forward service/k8s-microservice-service 8888:5000 &
          PF_PID=$!
          sleep 4
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8888/healthz || echo "000")
          kill $PF_PID 2>/dev/null || true
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Pipeline Health Check Passed!"
            exit 0
          else
            echo "Pipeline Health Check Failed with HTTP $HTTP_STATUS"
            exit 1
          fi
