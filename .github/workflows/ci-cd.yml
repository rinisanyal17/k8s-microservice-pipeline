name: CI/CD Microservice Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: [self-hosted]

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Build Docker Image
        run: |
          docker build -t k8s-microservice-pipeline:v1 .

      - name: 3. Load Image into Minikube Cache
        run: |
          minikube image load k8s-microservice-pipeline:v1

      - name: 4. Deploy Declarative Kubernetes Manifests
        run: |
          kubectl apply -f k8s/

      - name: 5. Verify Zero-Downtime Rollout
        run: |
          kubectl rollout status deployment/k8s-microservice-deployment --timeout=90s

      - name: 6. Automated Pipeline Health Check
        run: |
          curl -s http://myapp.local/healthz | grep "healthy"
